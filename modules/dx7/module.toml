# [I] OpenTracker module manifest (tools/profile.py): the DX7 engine as a card
# module (fork #21). In the tracker repository (profiles: in_tree = true),
# card = true in the profiles: no device image has it built in.
id      = "DX7S"
name    = "DX7 synth"
version = "1.0.0"
api     = 1
entry   = "dx7Module"
caps    = ["synthEngine"]
sources = ["dx7.cpp", "dx7_tables.cpp", "dx7_patch.cpp", "dx7_desc.cpp", "dx7_module.cpp"]
tests   = ["engine_dx7_test.cpp"]

flash_max_bytes   = 19500
sram_audio_bytes  = 4100              # the sine table (dx7_tables.h gDx7Sin)
sdram_bytes       = 0
fastrun_bytes     = 0
cpu_insn_per_unit = 22000             # bench limit per voice (algorithm 4 / 6 feedback chain)
max_units         = 8
engines           = [240]             # 0xF0: the fork's engine range (model/synth_patch.h)
