# RAM_DL on Bridgetek's FT81x emulator: the display budget script's frames
# replayed under Wine (`make -C sim eve-check`, tools/eve_emu). Fails on a
# coprocessor fault, more than 2048 RAM_DL words, or a frame the UI's count
# got wrong. The emulator DLL is downloaded at a pinned commit and checked
# by SHA-256 (Bridgetek's licence: not redistributed here).
# The sim-check job already holds every screen to the budget with the UI's own
# count; this cross-checks that count on the chip model, so it runs only when
# drawing code, fonts, the simulator or the replay tools change (and on main
# and by hand). The simulator is the default profile (full), so the module
# repositories are fetched as in ci.yml.
name: Display emulator

on:
  push:
    branches: [main]
    paths:
      - 'src/core/ui/**'
      - 'src/core/remote/display_tap.*'
      - 'src/core/hal_api.h'
      - 'src/core/modules/**'
      - 'profiles/**'
      - 'profile.mk'
      - 'sim/**'
      - 'tools/eve_emu/**'
      - '.github/workflows/display-emulator.yml'
      - '.github/scripts/apt-install.sh'
  pull_request:
    paths:
      - 'src/core/ui/**'
      - 'src/core/remote/display_tap.*'
      - 'src/core/hal_api.h'
      - 'src/core/modules/**'
      - 'profiles/**'
      - 'profile.mk'
      - 'sim/**'
      - 'tools/eve_emu/**'
      - '.github/workflows/display-emulator.yml'
      - '.github/scripts/apt-install.sh'
  workflow_dispatch:

concurrency:
  group: display-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  display-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # normally a few minutes; a stuck step (apt) otherwise holds the runner 6 h
    steps:
      - uses: actions/checkout@v5
      # The synth and effect modules (profiles/*.toml), the fork's as in ci.yml.
      - name: Fetch the module repositories
        run: |
          for r in opentracker-synths opentracker-fx; do
            git clone --depth 1 "https://github.com/syamajala/$r" "$GITHUB_WORKSPACE/../../$r"
          done
      - name: Cache apt packages
        # The package lists and .debs (apt-install.sh APT_CACHE): a hit installs
        # without the mirror, which has stalled jobs for their whole limit.
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-emu-${{ hashFiles('.github/scripts/apt-install.sh') }}
          restore-keys: apt-${{ runner.os }}-emu-
      - name: Install GCC 14, SDL2, Wine and MinGW
        # Only what the replay needs: 64-bit Wine running a console program and
        # the x86-64 MinGW compiler (the script skips recommends: fonts,
        # GStreamer, GL; most of Wine's ~200 packages and ~8 min).
        timeout-minutes: 12
        run: APT_CACHE="$HOME/apt-cache" .github/scripts/apt-install.sh g++-14 libsdl2-dev pkg-config wine wine64 g++-mingw-w64-x86-64
      - name: Cache the emulator download
        uses: actions/cache@v4
        with:
          path: |
            build/eve_emu/*.dll
            build/eve_emu/*.h
          key: eve-emu-${{ hashFiles('tools/eve_emu/check.py') }}
      - name: Emulator replay
        run: |
          set -o pipefail
          wineboot --init > /dev/null 2>&1 || true
          status=0
          make -C sim -j"$(nproc)" eve-check CXX=g++-14 2>&1 | tee eve-check.log || status=$?
          {
            echo '### FT81x emulator replay'
            echo '```'
            sed -n '/^dir  *frame/,$p' eve-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            # The sim's ALSA noise (no sound card on the runner) is not the error: the last lines are.
            grep -v "^ALSA lib" eve-check.log | tail -15 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          fi
      - name: Upload the frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eve-frames-${{ github.sha }}
          path: build/full/sim/eve
          if-no-files-found: ignore
