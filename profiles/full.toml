# Build profile (docs/PLAN_3X.md §7.3): the modules this image compiles in.
# Paths are relative to MODULES_DIR (default: ../../opentracker-synths from reimpl/).
name = "full"
variant = "v"                 # image PolyendTrackerOTv<ver>.ptf (24 characters)
display_name = "Full"         # shown with the version: boot splash, Config, diag log
flash_modules_max = 125000     # sum of the modules' declared flash_max_bytes

modules = [
    # [I] Off (no sound, no settings): the only synth built in; a New Project's
    # slots start on it. The synths below load from the card.
    { id = "OFF1", path = "modules/off" },
    { id = "ACD1", path = "modules/acd", card = true },
    { id = "FAT1", path = "modules/fat", card = true },
    { id = "VAP1", path = "modules/vap", card = true },
    { id = "PRC1", path = "modules/perc", card = true },
    { id = "WTF1", path = "modules/wtfm", card = true },
    # [I] Card modules (fork #21): not in the image; make card builds them for the
    # card's Modules/ folder, host builds (tests, sim) compile them in.
    { id = "DX7S", path = "modules/dx7", card = true },
    { id = "FM4S", path = "modules/fm4", card = true },
    { id = "JU6S", path = "modules/ju6", card = true },
    { id = "DTY1", path = "modules/dtype", card = true },
    { id = "CST1", path = "modules/cstype", card = true },
    { id = "ATY1", path = "modules/atype", card = true },
    { id = "TTY1", path = "modules/ttype", card = true },
    { id = "8TY1", path = "modules/eight", card = true },
    { id = "HND1", path = "modules/hand", card = true },
    { id = "BTY1", path = "modules/btype", card = true },
    { id = "ARC1", path = "modules/arc", card = true },
    { id = "1TY1", path = "modules/onetype", card = true },   # 1-Type (tools/sy1_to_patch for .sy1 patches)
    { id = "VTY1", path = "modules/vtype", card = true },
    # [I] Effects (opentracker-fx, next to opentracker-synths) as card modules:
    # each loads while it is on (the FX bank, Shift + Master); the master chain
    # runs them in a fixed order (ModuleHost::chainOrder). An effect that is also
    # a synth slot insert (Dirt = Drive, BBD = Chorus, and the slot-only three)
    # loads at boot for good instead.
    { id = "DIRT", path = "../opentracker-fx/modules/dirt", card = true },
    { id = "LOFI", path = "../opentracker-fx/modules/lofi", card = true },
    { id = "CHOR", path = "../opentracker-fx/modules/chorus", card = true },
    { id = "BBDC", path = "../opentracker-fx/modules/bbd", card = true },
    { id = "ECHO", path = "../opentracker-fx/modules/echo", card = true },
    { id = "TAPE", path = "../opentracker-fx/modules/tape", card = true },
    { id = "PHSR", path = "../opentracker-fx/modules/phaser", card = true },     # slot insert only
    { id = "TREM", path = "../opentracker-fx/modules/tremolo", card = true },    # slot insert only
    { id = "CRSH", path = "../opentracker-fx/modules/bitcrush", card = true },   # slot insert only
]
